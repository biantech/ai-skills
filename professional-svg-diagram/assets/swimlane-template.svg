<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <title>Swimlane architecture diagram template</title>
  <desc>Four ownership lanes showing a request moving across business, application, domain, and infrastructure contexts.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#2563eb"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.07"/>
    </filter>
    <style>
      .font { font-family: Inter, PingFang SC, Microsoft YaHei, Arial, sans-serif; }
      .title { font-size: 36px; font-weight: 760; fill: #0f172a; }
      .subtitle { font-size: 18px; fill: #475569; }
      .lane-title { font-size: 20px; font-weight: 720; fill: #334155; }
      .card-title { font-size: 16px; font-weight: 720; fill: #0f172a; }
      .card-text { font-size: 13px; fill: #475569; }
    </style>
  </defs>
  <rect x="0" y="0" width="1920" height="1080" fill="#ffffff"/>
  <text x="80" y="68" class="font title">Swimlane Diagram Title</text>
  <text x="82" y="104" class="font subtitle">Show ownership and execution context along the request path</text>
  <g filter="url(#shadow)">
    <rect x="70" y="145" width="1780" height="835" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="70" y="145" width="260" height="205" rx="18" fill="#f8fafc"/>
    <rect x="70" y="350" width="260" height="205" fill="#fff7ed"/>
    <rect x="70" y="555" width="260" height="205" fill="#f0fdf4"/>
    <rect x="70" y="760" width="260" height="220" rx="18" fill="#eff6ff"/>
    <line x1="330" y1="145" x2="330" y2="980" stroke="#cbd5e1" stroke-width="1.2"/>
    <line x1="70" y1="350" x2="1850" y2="350" stroke="#e2e8f0" stroke-width="1.2"/>
    <line x1="70" y1="555" x2="1850" y2="555" stroke="#e2e8f0" stroke-width="1.2"/>
    <line x1="70" y1="760" x2="1850" y2="760" stroke="#e2e8f0" stroke-width="1.2"/>
  </g>
  <text x="105" y="245" class="font lane-title">Business / Client</text>
  <text x="105" y="450" class="font lane-title">Application</text>
  <text x="105" y="655" class="font lane-title">Domain</text>
  <text x="105" y="870" class="font lane-title">Infrastructure</text>
  <g>
    <rect x="430" y="205" width="320" height="90" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="590" y="240" class="font card-title" text-anchor="middle">Request</text>
    <text x="590" y="267" class="font card-text" text-anchor="middle">State the business intent</text>
    <rect x="850" y="410" width="320" height="90" rx="12" fill="#ffffff" stroke="#f97316" stroke-width="1.5"/>
    <text x="1010" y="445" class="font card-title" text-anchor="middle">Orchestration</text>
    <text x="1010" y="472" class="font card-text" text-anchor="middle">Coordinate the use case</text>
    <rect x="1270" y="615" width="320" height="90" rx="12" fill="#ffffff" stroke="#22c55e" stroke-width="1.5"/>
    <text x="1430" y="650" class="font card-title" text-anchor="middle">Domain capability</text>
    <text x="1430" y="677" class="font card-text" text-anchor="middle">Apply business rules</text>
    <rect x="850" y="825" width="320" height="90" rx="12" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="1010" y="860" class="font card-title" text-anchor="middle">Dependency</text>
    <text x="1010" y="887" class="font card-text" text-anchor="middle">Persist or retrieve data</text>
  </g>
  <path d="M750 250 H790 V455 H850" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow)"/>
  <path d="M1170 455 H1210 V660 H1270" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow)"/>
  <path d="M1430 705 V870 H1170" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow)"/>
</svg>
